services:
  slack-personal-proxy:
    build: .
    container_name: slack-personal-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8282:3000"
    env_file:
      - .env
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
