services:
  slack-personal-proxy:
    build: .
    container_name: slack-personal-proxy
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-8282}:3000"
    env_file:
      - .env
    volumes:
      - ./certs:/app/certs:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
