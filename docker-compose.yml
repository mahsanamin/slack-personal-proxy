services:
  slack-personal-proxy:
    build: .
    container_name: slack-personal-proxy
    restart: unless-stopped
    # Run as the host user so the bind-mounted ./data (writable state: apikeys.json,
    # secrets.enc, dm-allowlist.json) is writable. The proxy script exports PUID/PGID;
    # defaults to the image's appuser (1001) if unset.
    user: "${PUID:-1001}:${PGID:-1001}"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-8282}:3000"
    env_file:
      - .env
    volumes:
      - ./certs:/app/certs:ro
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
